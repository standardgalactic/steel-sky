<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Sky: image pipeline tests</title>
<meta name="description" content="Image generation experiments for a catalogue of 440 screenplay projects, run on a local Stable Diffusion pipeline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Spectral:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<style>
:root{
  --ground:#D5DADD; --panel:#C6CDD1; --ink:#17191C; --soft:#454C52; --rule:#9FA9B0; --amber:#B8741A;
  --serif:"Spectral",Georgia,serif; --label:"Archivo Narrow","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ground:#1B1D1F;--panel:#26292C;--ink:#E3E6E8;--soft:#A7AFB5;--rule:#454C52;--amber:#E0A04A}
}
:root[data-theme="dark"]{--ground:#1B1D1F;--panel:#26292C;--ink:#E3E6E8;--soft:#A7AFB5;--rule:#454C52;--amber:#E0A04A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font:400 18px/1.6 var(--serif)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,img:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.label{font:600 14px/1.3 var(--label);letter-spacing:.02em;color:var(--soft)}

/* hero contact sheet */
#sheet{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
#sheet img,#sheet div{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--panel)}
@media (max-width:700px){#sheet{grid-template-columns:repeat(4,1fr)}}
header.top{padding:28px 16px 8px}
header.top h1{font:800 clamp(44px,8vw,96px)/.95 var(--serif);margin:0 0 14px;letter-spacing:-.02em}
header.top p{max-width:60ch;margin:0;font-size:21px}
nav{position:sticky;top:0;background:var(--ground);border-bottom:1px solid var(--rule);z-index:5}
nav .wrap{display:flex;gap:22px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav a{font:600 16px var(--label);text-decoration:none;white-space:nowrap;color:var(--soft)}
nav a:hover{color:var(--ink)}

section{padding:56px 0 8px}
h2{font:800 clamp(28px,4vw,40px)/1.1 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
h3{font:600 22px/1.3 var(--serif);margin:28px 0 8px}
p{margin:0 0 14px;max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);margin:22px 0}
.stats div{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--rule)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:800 30px/1.1 var(--serif)}
table{border-collapse:collapse;width:100%;max-width:900px;font-size:16px;margin:12px 0 20px}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 14px var(--label);color:var(--soft)}
code,pre{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre{background:var(--panel);padding:14px;overflow:auto;border:1px solid var(--rule);max-width:900px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:960px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:6px}

/* experiments */
.lab{display:grid;grid-template-columns:230px 1fr;gap:28px;margin-top:20px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.runs{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);align-self:start}
@media (max-width:860px){.runs{flex-direction:row;overflow-x:auto}}
.runs button{all:unset;cursor:pointer;padding:10px 14px;border-bottom:1px solid var(--rule);min-width:120px}
@media (max-width:860px){.runs button{border-bottom:0;border-right:1px solid var(--rule)}}
.runs button:last-child{border:0}
.runs button b{display:block;font:600 18px/1.2 var(--serif)}
.runs button span{font:400 14px/1.3 var(--label);color:var(--soft)}
.runs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.runs button[aria-selected="true"] span{color:var(--ground);opacity:.8}
.runnote{max-width:68ch;margin:0 0 18px}
.group{margin:0 0 30px}
.group h3{margin:0 0 4px;font-size:20px}
.group .prompt{font:italic 400 15px/1.45 var(--serif);color:var(--soft);margin:0 0 8px;max-width:80ch}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,200px));gap:6px;justify-content:start}
.strip button{all:unset;display:block;cursor:zoom-in;background:var(--panel);outline:1px solid var(--rule);outline-offset:-1px}
.strip button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.strip img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.strip button:hover img{opacity:.88}
.empty{padding:20px;border:1px dashed var(--rule);color:var(--soft)}

/* archive */
.sheets{display:grid;gap:18px}
.sheets figure{margin:0}
.sheets button{all:unset;cursor:zoom-in;display:block;width:100%}
.sheets img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--panel)}
.sheets figcaption{font:400 14px var(--label);color:var(--soft);margin-top:4px}
.prelim{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);max-width:900px}
.prelim img{display:block;width:100%}

/* described images */
.desc{display:grid;gap:22px;max-width:900px}
.desc article{display:grid;grid-template-columns:minmax(160px,260px) 1fr;gap:18px;border-top:1px solid var(--rule);padding-top:16px}
@media (max-width:640px){.desc article{grid-template-columns:1fr}}
.desc img{display:block;width:100%;height:auto;background:var(--panel)}
.desc .sum{font-size:16px;line-height:1.55}
.desc .sum ul,.desc .sum ol{margin:6px 0 6px 20px;padding:0}
.pager{display:flex;gap:12px;align-items:center;margin:20px 0;font:600 15px var(--label)}
.pager button{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--ink)}
.pager button:hover{background:var(--ink);color:var(--ground)}
.pager button[disabled]{opacity:.35;cursor:default}

/* lightbox */
dialog{border:0;padding:0;background:var(--ground);color:var(--ink);max-width:min(1000px,96vw);max-height:96vh;width:100%}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog .box{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr);gap:0}
@media (max-width:760px){dialog .box{grid-template-columns:1fr}}
dialog img{display:block;width:100%;height:auto;max-height:88vh;object-fit:contain;background:var(--panel)}
dialog .meta{padding:16px;overflow:auto;max-height:88vh;font-size:15px}
dialog .meta dt{font:600 13px var(--label);color:var(--soft);margin-top:10px}
dialog .meta dd{margin:0;overflow-wrap:anywhere}
dialog .bar{display:flex;gap:8px;margin-top:14px}
dialog .bar button{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--ink);font:600 14px var(--label)}
dialog .bar button:hover{background:var(--ink);color:var(--ground)}
footer{padding:56px 0 64px;color:var(--soft);font-size:15px}
.err{padding:16px;border:1px solid var(--amber)}
</style>
</head>
<body>

<div id="sheet" aria-label="Contact sheet of generated images"></div>

<header class="top wrap">
  <h1>Steel Sky</h1>
  <p>A local image pipeline, tested against a catalogue of 440 screenplay projects. This site shows the experiments: what the model drew, what it could not, and how the prompts changed between runs.</p>
</header>

<nav aria-label="Sections"><div class="wrap">
  <a href="#catalogue">Catalogue</a>
  <a href="#experiments">Experiments</a>
  <a href="#findings">Findings</a>
  <a href="#archive">Archive</a>
  <a href="#described">Described images</a>
  <a href="#pipeline">Pipeline</a>
